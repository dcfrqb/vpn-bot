name: CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run unit tests (incl. 3.0 flows, callback matrix, invariants, contracts)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/ -m "not integration" -v

      - name: 3.0 seams (explicit, fail fast on a broken seam)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest -q tests/flows tests/invariants tests/contracts tests/test_r3_callbacks.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (undefined names, unused imports, redefinitions)
        run: ruff check --select F821,F401,F811 src

      - name: Ruff full F on 3.0 layers and tests
        run: >
          ruff check --select F
          src/app/bot src/app/domain src/app/infra src/app/worker src/app/api/routes src/app/api/app.py
          src/app/container.py src/app/services/ports.py src/app/services/shims.py
          src/app/services/notifications.py
          src/app/services/promo.py src/app/services/promo_types.py src/app/services/promo_repo.py
          src/app/services/referral.py src/app/services/grants.py src/app/services/broadcast.py
          src/app/services/broadcast_segments.py src/app/services/broadcast_drafts.py src/app/services/admin_stats.py
          tests/flows tests/invariants tests/contracts tests/fakes tests/growth

  alembic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: crs_user_test
          POSTGRES_PASSWORD: crs_pass_test
          POSTGRES_DB: crs_vpn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crs_user_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Single alembic head
        run: |
          python - <<'EOF'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          print("heads:", heads)
          assert len(heads) == 1, f"expected exactly one alembic head, got {heads}"
          EOF

      - name: Run migrations against an empty database
        env:
          # app/db/migrations/env.py reads settings.DATABASE_URL (app.config.Settings,
          # itself a plain os.environ / .env read via pydantic-settings) and
          # rewrites postgresql:// to postgresql+asyncpg:// itself.
          DATABASE_URL: postgresql://crs_user_test:crs_pass_test@localhost:5432/crs_vpn_test
        run: |
          alembic upgrade head

      - name: Check for model/migration drift
        env:
          DATABASE_URL: postgresql://crs_user_test:crs_pass_test@localhost:5432/crs_vpn_test
        run: |
          alembic check

      - name: Downgrade/upgrade the 3.0 revision (idempotent, additive)
        env:
          DATABASE_URL: postgresql://crs_user_test:crs_pass_test@localhost:5432/crs_vpn_test
        run: |
          alembic downgrade 7b1c2d3e4f50
          alembic upgrade head
          alembic check

      - name: Integration tests on real Postgres
        env:
          DATABASE_URL: postgresql://crs_user_test:crs_pass_test@localhost:5432/crs_vpn_test
          HOTFIX_PG_URL: postgresql+asyncpg://crs_user_test:crs_pass_test@localhost:5432/crs_vpn_test
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/integration -m integration -v
